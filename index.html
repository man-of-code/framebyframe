<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("fbf:theme") || "system";
          var dark = p === "dark" || (p === "system" && !window.matchMedia("(prefers-color-scheme: light)").matches);
          if (!dark) document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/abril-fatface-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0B16" />
    <title>Frame by Frame</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
