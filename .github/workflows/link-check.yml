name: Link check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        continue-on-error: true
        run: npm run check-links > link-check.log 2>&1
      - name: Open an issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const log = fs.readFileSync("link-check.log", "utf8").slice(-60000);
            const title = "Link check failed";
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: "open" });
            const match = existing.data.find((issue) => issue.title === title);
            const body = "Weekly link check failed. This workflow is not a merge gate.\n\n```\n" + log + "\n```";
            if (match) {
              await github.rest.issues.createComment({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1
